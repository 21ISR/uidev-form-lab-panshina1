<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pickmi">
        <header class="pickmi-header">
            <h1>Student Registration</h1>
            <p>Create your student account</p>
        </header>
        <form class="form" action="/api/register" method="post">
            <div class="mono">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
            </div>
            <div class="mono">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            <div class="mono">
                <label for="role">Select Program</label>
                <select id="role" name="role">
                <option value="">Choose your program</option>
            </div>
            </select>
            <div class="mono">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password">
            </div>
            <div class="mono">
                <label for="cofirm-password">Confirm password</label>
                <input type="password" id="password" name="password" placeholder="Confirm your password">
            </div>
            <div class="remember-forgot-container">
            <label class="remember-me">
                <input type="checkbox" name="agree" value="yes">
                <span>I agree to the Terms of Service and Privacy Policy</span>
            </label>
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
            <footer class="form-footer">
                <p>Alreaddy have an account? <a href="index.html">Log in</a></p>
            </footer>
        </form>
    </main>
</body>
</html>
